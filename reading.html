<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Research &middot; Christianity: History, Theology, and Civilization</title>
<meta name="description" content="Research notes by book and chapter." />
<link rel="icon" href="assets/icon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="apple-mobile-web-app-title" content="Christianity" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <h1><a href="timeline.html">Christianity: History, Theology, and Civilization</a></h1>
    <nav>
      <a href="timeline.html">Timeline</a>
      <a href="denominations.html">Denominations</a>
      <a href="terminology.html">Metaontology</a>
      <a href="reading.html" aria-current="page">Research</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <section>
    <div class="bar">
      <h2>Research</h2>
      <div class="bar-actions">
        <button type="button" class="btn btn-primary" id="new-book">Add book</button>
        <button type="button" class="btn" id="export">Export</button>
        <button type="button" class="btn" id="import">Import</button>
        <input type="file" id="import-file" accept="application/json" hidden />
      </div>
    </div>

    <!-- Library -->
    <div id="library">
      <p class="empty" id="empty" hidden>No books yet.</p>
      <ul class="books" id="books"></ul>
    </div>

    <!-- One book -->
    <div id="book" hidden>
      <p class="crumb"><button type="button" class="linkish" id="back">&larr; All books</button></p>

      <div class="book-header" id="book-header" hidden>
        <h3 class="bh-title" id="bh-title"></h3>
        <p class="bh-meta" id="bh-meta"></p>
        <p class="bh-note" id="bh-note"></p>
        <button type="button" class="linkish" id="edit-book">Edit book details</button>
      </div>

      <div id="book-form">
      <div class="fields">
        <label class="field field-wide">
          <span>Title</span>
          <input type="text" id="f-title" autocomplete="off" />
        </label>
        <label class="field field-wide">
          <span>Author</span>
          <input type="text" id="f-author" autocomplete="off" />
        </label>
        <label class="field">
          <span>Publisher</span>
          <input type="text" id="f-publisher" autocomplete="off" />
        </label>
        <label class="field">
          <span>Year</span>
          <input type="text" id="f-year" inputmode="numeric" autocomplete="off" />
        </label>
        <label class="field field-wide">
          <span>Publication details</span>
          <input type="text" id="f-details" autocomplete="off"
                 placeholder="Edition, translator, series, ISBN" />
        </label>
        <label class="field field-wide">
          <span>Note on the book</span>
          <textarea id="f-note" rows="3"></textarea>
        </label>
      </div>
      <p class="form-actions">
        <button type="button" class="btn btn-primary" id="save-book">Save book</button>
      </p>
      </div>

      <div class="bar bar-sub">
        <h3>Chapters</h3>
        <button type="button" class="btn" id="new-chapter">Add chapter</button>
      </div>

      <p class="empty" id="empty-chapters" hidden>No chapters yet.</p>
      <ol class="chapters" id="chapters"></ol>

      <p class="danger-row">
        <button type="button" class="linkish danger" id="delete-book">Delete this book</button>
      </p>
    </div>
  </section>

</main>

<template id="tpl-chapter">
  <li class="chapter">
    <div class="chapter-head">
      <input type="text" class="c-label" placeholder="No." aria-label="Chapter number" autocomplete="off" />
      <input type="text" class="c-title" placeholder="Chapter title" aria-label="Chapter title" autocomplete="off" />
      <span class="chapter-tools">
        <button type="button" class="icon-btn c-up" title="Move up" aria-label="Move up">&uarr;</button>
        <button type="button" class="icon-btn c-down" title="Move down" aria-label="Move down">&darr;</button>
        <button type="button" class="icon-btn c-del" title="Delete chapter" aria-label="Delete chapter">&times;</button>
      </span>
    </div>
    <div class="editor">
      <div class="toolbar" role="toolbar" aria-label="Formatting">
        <button type="button" class="tb" data-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" class="tb" data-cmd="italic" title="Italic"><i>I</i></button>
        <button type="button" class="tb tb-mark" data-cmd="mark" title="Highlight">H</button>
        <button type="button" class="tb" data-cmd="insertUnorderedList" title="Bulleted list">&bull;</button>
        <button type="button" class="tb" data-cmd="blockquote" title="Quotation">&ldquo;</button>
        <button type="button" class="tb" data-cmd="clear" title="Clear formatting">&#10005;</button>
      </div>
      <div class="c-notes" contenteditable="true" role="textbox" aria-multiline="true"
           aria-label="Chapter notes" data-placeholder="Notes"></div>
    </div>
  </li>
</template>

<script>
(function () {
  'use strict';

  var KEY = 'christianity.reading.v1';
  var API = '/api/notes';
  var PULL_MS = 30000;
  var PUSH_MS = 2000;
  var TOMBSTONE_DAYS = 90;

  var $ = function (id) { return document.getElementById(id); };
  var now = function () { return Date.now(); };

  // ---- state -------------------------------------------------------------
  // localStorage is the source of truth for this device and works offline.
  // The API is a reconciler on top of it, not a dependency.
  var data = { version: 1, books: [] };
  var storageWorks = true;
  var syncWorks = null;      // null until the first attempt settles
  var current = null;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.books)) data = parsed;
      }
    } catch (e) {
      storageWorks = false;
    }
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      storageWorks = false;
      return false;
    }
  }

  var saveTimer = null, pushTimer = null;

  function save() {
    if (current) current.updatedAt = now();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      flash(persist() ? 'Saved'
        : 'Not saved: this browser is blocking storage. Export to keep your work.',
        !storageWorks);
      schedulePush();
    }, 250);
  }

  var flashTimer = null, holdUntil = 0;

  // A message set with hold survives the autosave notice that follows it.
  function flash(msg, hold) {
    var el = $('save-state');
    if (!el) return;
    if (!hold && now() < holdUntil) return;
    el.textContent = msg;
    holdUntil = hold ? now() + 4000 : 0;
    if (flashTimer) clearTimeout(flashTimer);
    if (msg) {
      flashTimer = setTimeout(function () {
        el.textContent = '';
        holdUntil = 0;
      }, hold ? 4000 : 1600);
    }
  }

  function uid() {
    return 'b' + now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function live() {
    return data.books.filter(function (b) { return !b.deleted; });
  }

  function byId(id) {
    for (var i = 0; i < data.books.length; i++) {
      if (data.books[i].id === id) return data.books[i];
    }
    return null;
  }

  // ---- merge -------------------------------------------------------------
  // Last write wins per book, so two devices editing different books never
  // conflict. A deleted book leaves a tombstone, otherwise the other device
  // would resurrect it on the next pull.
  function merge(mine, theirs) {
    var out = {};
    var cutoff = now() - TOMBSTONE_DAYS * 86400000;

    function take(book) {
      if (!book || !book.id) return;
      if (book.deleted && (book.updatedAt || 0) < cutoff) return;  // aged out
      var seen = out[book.id];
      if (!seen || (book.updatedAt || 0) > (seen.updatedAt || 0)) out[book.id] = book;
    }

    mine.forEach(take);
    theirs.forEach(take);

    return Object.keys(out).map(function (k) { return out[k]; })
      .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
  }

  // ---- sync --------------------------------------------------------------
  function typing() {
    var el = document.activeElement;
    return !!el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT');
  }

  function schedulePush() {
    if (syncWorks === false) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(push, PUSH_MS);
  }

  function push() {
    if (syncWorks === false) return;
    fetch(API, {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ version: 1, books: data.books })
    }).then(function (r) {
      syncWorks = r.ok;
      if (r.ok) flash('Synced');
    }).catch(function () {
      syncWorks = false;
      setSyncNote();
    });
  }

  function pull() {
    if (syncWorks === false || !navigator.onLine) return;
    fetch(API, { headers: { 'accept': 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function (remote) {
        syncWorks = true;
        setSyncNote();
        if (!remote || !Array.isArray(remote.books)) return;

        var before = JSON.stringify(data.books);
        data.books = merge(data.books, remote.books);
        if (JSON.stringify(data.books) === before) return;

        persist();
        // Never repaint a field the user is in the middle of: the merged data
        // is already saved and appears at the next natural render.
        if (typing()) return;
        if (current) {
          var fresh = byId(current.id);
          if (!fresh || fresh.deleted) { closeBook(); return; }
          current = fresh;
          if (editing) fillFields(); else showHeader();
          renderChapters();
        } else {
          renderLibrary();
        }
        flash('Updated from sync', true);
      })
      .catch(function () {
        syncWorks = false;
        setSyncNote();
      });
  }

  function setSyncNote() {
    var el = $('sync-note');
    if (!el) return;
    if (syncWorks === true) {
      el.textContent = 'Syncing across your signed-in devices.';
    } else if (syncWorks === false) {
      el.textContent = 'Not syncing right now. Notes are still saved on this device.';
    } else {
      el.textContent = '';
    }
  }

  // ---- library -----------------------------------------------------------
  function renderLibrary() {
    var list = $('books');
    list.textContent = '';
    var books = live();
    $('empty').hidden = books.length > 0;

    books.forEach(function (b) {
      var li = document.createElement('li');
      var a = document.createElement('button');
      a.type = 'button';
      a.className = 'book-row';

      var title = document.createElement('span');
      title.className = 'book-title';
      title.textContent = b.title || 'Untitled';

      var meta = document.createElement('span');
      meta.className = 'book-meta';
      var bits = [];
      if (b.author) bits.push(b.author);
      if (b.year) bits.push(b.year);
      bits.push(b.chapters.length + (b.chapters.length === 1 ? ' chapter' : ' chapters'));
      meta.textContent = bits.join(' · ');

      a.appendChild(title);
      a.appendChild(meta);
      a.addEventListener('click', function () { openBook(b.id, false); });
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  // ---- one book ----------------------------------------------------------
  var FIELDS = [
    ['f-title', 'title'], ['f-author', 'author'], ['f-publisher', 'publisher'],
    ['f-year', 'year'], ['f-details', 'details'], ['f-note', 'note']
  ];

  function fillFields() {
    FIELDS.forEach(function (pair) { $(pair[0]).value = current[pair[1]] || ''; });
  }

  // A book's details are a form while you are entering them and a heading
  // afterwards, so that once the book is recorded the page is about chapters.
  var editing = false;

  function renderHeader() {
    $('bh-title').textContent = current.title || 'Untitled';
    var bits = [current.author, current.publisher, current.year, current.details]
      .filter(function (x) { return x; });
    $('bh-meta').textContent = bits.join(' \u00b7 ');
    $('bh-meta').hidden = bits.length === 0;
    $('bh-note').textContent = current.note || '';
    $('bh-note').hidden = !current.note;
  }

  function showForm() {
    editing = true;
    $('book-header').hidden = true;
    $('book-form').hidden = false;
  }

  function showHeader() {
    editing = false;
    renderHeader();
    $('book-form').hidden = true;
    $('book-header').hidden = false;
  }

  function openBook(id, edit) {
    current = byId(id);
    if (!current || current.deleted) return;
    fillFields();
    renderChapters();
    if (edit) showForm(); else showHeader();
    $('library').hidden = true;
    $('book').hidden = false;
    window.scrollTo(0, 0);
    if (edit) $('f-title').focus();
  }

  function closeBook() {
    current = null;
    $('book').hidden = true;
    $('library').hidden = false;
    renderLibrary();
    window.scrollTo(0, 0);
  }

  FIELDS.forEach(function (pair) {
    $(pair[0]).addEventListener('input', function () {
      if (!current) return;
      current[pair[1]] = this.value;
      save();
    });
  });

  // ---- notes markup ------------------------------------------------------
  // Notes are HTML now. Everything written to the page or read from a file
  // goes through this first: only these tags survive, and no attributes do,
  // so an imported file cannot carry anything executable.
  var ALLOWED = ['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'MARK', 'UL', 'OL', 'LI',
                 'BLOCKQUOTE', 'DIV'];

  function sanitize(html) {
    var box = document.createElement('div');
    box.innerHTML = html || '';
    (function walk(node) {
      var child = node.firstChild;
      while (child) {
        var next = child.nextSibling;
        if (child.nodeType === 1) {
          if (ALLOWED.indexOf(child.tagName) === -1) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
          } else {
            for (var i = child.attributes.length - 1; i >= 0; i--) {
              child.removeAttribute(child.attributes[i].name);
            }
            walk(child);
          }
        } else if (child.nodeType !== 3) {
          node.removeChild(child);
        }
        child = next;
      }
    }(box));
    return box.innerHTML;
  }

  // Notes written before the editor existed are plain text.
  function asHtml(stored) {
    if (!stored) return '';
    if (stored.indexOf('<') === -1) {
      var box = document.createElement('div');
      box.textContent = stored;
      return box.innerHTML.replace(/\n/g, '<br>');
    }
    return sanitize(stored);
  }

  function marked() {
    var sel = window.getSelection();
    if (!sel.rangeCount) return null;
    var node = sel.getRangeAt(0).commonAncestorContainer;
    while (node && node !== document.body) {
      if (node.nodeType === 1 && node.tagName === 'MARK') return node;
      node = node.parentNode;
    }
    return null;
  }

  function toggleMark() {
    var existing = marked();
    if (existing) {
      while (existing.firstChild) existing.parentNode.insertBefore(existing.firstChild, existing);
      existing.parentNode.removeChild(existing);
      return;
    }
    var sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) return;
    var range = sel.getRangeAt(0);
    var mark = document.createElement('mark');
    try {
      range.surroundContents(mark);
    } catch (e) {
      // The selection crosses element boundaries; fall back to replacing it.
      mark.appendChild(range.extractContents());
      range.insertNode(mark);
    }
    sel.removeAllRanges();
  }

  function exec(cmd) {
    if (cmd === 'mark') return toggleMark();
    if (cmd === 'blockquote') return document.execCommand('formatBlock', false, 'blockquote');
    if (cmd === 'clear') {
      document.execCommand('removeFormat');
      var m = marked();
      if (m) {
        while (m.firstChild) m.parentNode.insertBefore(m.firstChild, m);
        m.parentNode.removeChild(m);
      }
      return;
    }
    document.execCommand(cmd);
  }

  function renderChapters() {
    var list = $('chapters');
    list.textContent = '';
    $('empty-chapters').hidden = current.chapters.length > 0;

    current.chapters.forEach(function (ch, index) {
      var node = $('tpl-chapter').content.firstElementChild.cloneNode(true);
      var label = node.querySelector('.c-label');
      var title = node.querySelector('.c-title');
      var notes = node.querySelector('.c-notes');

      label.value = ch.label || '';
      title.value = ch.title || '';
      notes.innerHTML = asHtml(ch.notes);

      label.addEventListener('input', function () { ch.label = this.value; save(); });
      title.addEventListener('input', function () { ch.title = this.value; save(); });
      notes.addEventListener('input', function () { ch.notes = sanitize(this.innerHTML); save(); });

      // Paste as plain text, so copying from a web page does not drag its
      // styling in with it.
      notes.addEventListener('paste', function (e) {
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text');
        document.execCommand('insertText', false, text);
      });

      node.querySelectorAll('.tb').forEach(function (btn) {
        // mousedown would move focus out of the editor and lose the selection
        btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        btn.addEventListener('click', function () {
          notes.focus();
          exec(btn.dataset.cmd);
          ch.notes = sanitize(notes.innerHTML);
          save();
        });
      });

      node.querySelector('.c-up').addEventListener('click', function () { move(index, -1); });
      node.querySelector('.c-down').addEventListener('click', function () { move(index, 1); });
      node.querySelector('.c-del').addEventListener('click', function () {
        if (!window.confirm('Delete this chapter and its notes?')) return;
        current.chapters.splice(index, 1);
        save();
        renderChapters();
      });

      list.appendChild(node);
    });
  }

  function move(index, delta) {
    var to = index + delta;
    if (to < 0 || to >= current.chapters.length) return;
    var ch = current.chapters.splice(index, 1)[0];
    current.chapters.splice(to, 0, ch);
    save();
    renderChapters();
  }

  // ---- actions -----------------------------------------------------------
  $('new-book').addEventListener('click', function () {
    var book = { id: uid(), title: '', author: '', publisher: '', year: '',
                 details: '', note: '', chapters: [], updatedAt: now() };
    data.books.push(book);
    save();
    openBook(book.id, true);
  });

  $('new-chapter').addEventListener('click', function () {
    current.chapters.push({ id: uid(), label: '', title: '', notes: '' });
    save();
    renderChapters();
    var last = $('chapters').lastElementChild;
    if (last) last.querySelector('.c-label').focus();
  });

  $('delete-book').addEventListener('click', function () {
    if (!window.confirm('Delete "' + (current.title || 'Untitled') + '" and all its notes?')) return;
    // Replace with a tombstone so the deletion reaches other devices.
    var index = data.books.indexOf(current);
    data.books[index] = { id: current.id, deleted: true, updatedAt: now(), chapters: [] };
    current = null;
    persist();
    schedulePush();
    closeBook();
  });

  $('save-book').addEventListener('click', function () {
    persist();
    schedulePush();
    showHeader();
    flash('Saved');
  });

  $('edit-book').addEventListener('click', function () {
    showForm();
    $('f-title').focus();
  });

  $('back').addEventListener('click', closeBook);

  $('export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'reading-notes.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  $('import').addEventListener('click', function () { $('import-file').click(); });

  $('import-file').addEventListener('change', function () {
    var file = this.files && this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try {
        incoming = JSON.parse(reader.result);
      } catch (e) {
        window.alert('That file is not valid JSON.');
        return;
      }
      if (!incoming || !Array.isArray(incoming.books)) {
        window.alert('That file has no books in it.');
        return;
      }
      // An import is an explicit choice, so it wins over what is already here.
      var stamp = now();
      incoming.books.forEach(function (b) {
        if (!b.id) b.id = uid();
        if (!Array.isArray(b.chapters)) b.chapters = [];
        b.updatedAt = stamp;
      });
      data.books = merge(data.books, incoming.books);
      persist();
      schedulePush();
      if (current) closeBook(); else renderLibrary();
      flash('Imported ' + incoming.books.length +
            (incoming.books.length === 1 ? ' book' : ' books'), true);
    };
    reader.readAsText(file);
    this.value = '';
  });

  // ---- start -------------------------------------------------------------
  load();
  renderLibrary();
  if (!storageWorks) {
    flash('This browser is blocking storage, so nothing will be kept.', true);
  }

  pull();
  setInterval(function () {
    if (document.visibilityState === 'visible') pull();
  }, PULL_MS);
  window.addEventListener('focus', pull);
  window.addEventListener('online', function () { syncWorks = null; pull(); });
}());
</script>

</body>
</html>
