<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Passages &middot; Christianity: History, Theology, and Civilization</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/icon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="apple-mobile-web-app-title" content="Christianity" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <h1><a href="timeline.html">Christianity: History, Theology, and Civilization</a></h1>
    <nav>
      <a href="timeline.html">Timeline</a>
      <a href="denominations.html">Denominations</a>
      <a href="terminology.html">Metaontology</a>
      <a href="reading.html">Research</a>
      <a href="passages.html" aria-current="page">Passages</a>
      <a href="ptsem.html">PTSEM</a>
      <a href="bulletins.html" id="nav-bulletins" hidden>Bulletins</a>
    </nav>
    <script>try { if (localStorage.getItem('christianity.bulletins.key')) document.getElementById('nav-bulletins').hidden = false; } catch (e) {}</script>
  </div>
</header>

<main class="wrap">

  <section>
    <div class="bar">
      <h2>Passages</h2>
      <div class="bar-actions">
        <span class="sync-state" id="sync-state" role="status"></span>
        <button type="button" class="btn btn-primary" id="add">Add passage</button>
        <button type="button" class="btn" id="export">Export</button>
        <button type="button" class="btn" id="import">Import</button>
        <input type="file" id="import-file" accept="application/json" hidden />
      </div>
    </div>

    <p class="sort" id="sort" role="group" aria-label="Sort">
      <span class="sort-label">Sort</span>
      <button type="button" class="sort-btn" data-sort="bible" aria-pressed="false">Text order</button>
      <button type="button" class="sort-btn" data-sort="oldest" aria-pressed="false">Oldest to newest</button>
      <button type="button" class="sort-btn" data-sort="recent" aria-pressed="true">Newest to oldest</button>
    </p>

    <p class="empty" id="empty" hidden>No passages yet.</p>
    <ol class="fav-list" id="list"></ol>
  </section>

</main>

<template id="tpl-passage">
  <li class="fav">
    <div class="reading-row">
      <input type="text" class="f-passage" placeholder="Passage, such as John 3:16" aria-label="Passage" autocomplete="off" />
      <button type="button" class="icon-btn f-del" title="Remove passage" aria-label="Remove passage">&times;</button>
    </div>
    <details class="passage" open hidden>
      <summary></summary>
      <div class="passage-text"></div>
    </details>
    <p class="passage-none" hidden>No King James passage matches this.</p>
    <div class="f-note editor-here"></div>
  </li>
</template>

<script src="sync.js"></script>
<script src="passages.js"></script>
<script src="editor.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var now = function () { return Date.now(); };

  // ---- state -------------------------------------------------------------
  // localStorage is the source of truth for this device and works offline.
  // On an unlocked device, sync.js keeps it level with the other devices.
  var KEY = 'christianity.passages.v1';
  var TOMBSTONE_DAYS = 90;

  var data = { version: 1, passages: [] };
  var link = null;
  var stale = false;         // newer passages arrived while a field had focus

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.passages)) data = parsed;
      }
    } catch (e) { /* start empty */ }
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* full or blocked */ }
  }

  var saveTimer = null;

  function save() {
    if (link) link.changed();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saved, 250);
  }

  function saved() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    persist();
    if (link) link.changed();
  }

  function uid() {
    return 'p' + now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // Synced and imported data is not trusted to have the right shape.
  function live() {
    return data.passages.filter(function (p) { return p && !p.deleted; }).map(function (p) {
      p.passage = typeof p.passage === 'string' ? p.passage : '';
      p.note = asHtml(typeof p.note === 'string' ? p.note : '');
      p.createdAt = Number(p.createdAt) || Number(p.updatedAt) || 0;
      return p;
    }).sort(order === 'bible' ? byBible : order === 'oldest' ? byOldest : byRecent);
  }

  // ---- order -------------------------------------------------------------
  // In the order of the books of the Bible, oldest first, or newest first. The choice
  // is kept on this device and is not part of what syncs.
  var ORDER_KEY = 'christianity.passages.sort';
  var order = 'recent';
  try {
    var kept = localStorage.getItem(ORDER_KEY);
    if (kept === 'bible' || kept === 'oldest') order = kept;
  } catch (e) { /* default */ }

  function byRecent(a, b) { return b.createdAt - a.createdAt; }
  function byOldest(a, b) { return a.createdAt - b.createdAt; }

  // An entry with no reference yet, or one that cannot be read, comes first,
  // where a new entry is expected and a mistyped one is seen.
  function byBible(a, b) {
    var x = Passages.place(a.passage), y = Passages.place(b.passage);
    if (!x || !y) return x ? 1 : y ? -1 : byRecent(a, b);
    // Latest in the Bible at the top, so Genesis sits at the foot of the list.
    return y[0] - x[0] || y[1] - x[1] || y[2] - x[2] || byRecent(a, b);
  }

  function showOrder(count) {
    Array.prototype.forEach.call(document.querySelectorAll('.sort-btn'), function (btn) {
      btn.setAttribute('aria-pressed', String(btn.dataset.sort === order));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.sort-btn'), function (btn) {
    btn.addEventListener('click', function () {
      if (order === btn.dataset.sort) return;
      order = btn.dataset.sort;
      try { localStorage.setItem(ORDER_KEY, order); } catch (e) { /* this visit only */ }
      render();
    });
  });

  function touch(item) {
    item.updatedAt = now();
    save();
  }

  // ---- merge -------------------------------------------------------------
  // Last write wins per passage. A removed passage leaves a tombstone,
  // otherwise another device would bring it back on the next pull.
  function merge(mine, theirs) {
    var out = {};
    var cutoff = now() - TOMBSTONE_DAYS * 86400000;

    function take(item) {
      if (!item || typeof item.id !== 'string' || !item.id) return;
      if (item.deleted && (item.updatedAt || 0) < cutoff) return;  // aged out
      var seen = out[item.id];
      if (!seen || (item.updatedAt || 0) > (seen.updatedAt || 0)) out[item.id] = item;
    }

    mine.forEach(take);
    theirs.forEach(take);

    return Object.keys(out).sort().map(function (k) { return out[k]; });
  }

  // ---- sync --------------------------------------------------------------
  function typing() {
    var el = document.activeElement;
    return !!el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.isContentEditable);
  }

  function arrived(passages, changed) {
    data.passages = passages;
    persist();
    if (!changed) return;
    if (typing()) stale = true; else render();
  }

  function connect(device) {
    link = Notes.sync({
      device: device,
      path: '/api/passages',
      field: 'passages',
      read: function () { return data.passages; },
      write: arrived,
      merge: merge,
      note: $('sync-state')
    });
  }

  // ---- the text of a passage ---------------------------------------------
  // Looked up from the reference each time from the King James files that
  // ship with the site, not stored with the list.
  var PRINT_MS = 600;

  function print(row, typed) {
    var block = row.querySelector('.passage');
    var none = row.querySelector('.passage-none');
    row.asked = typed;

    if (!typed.trim()) {
      block.hidden = true;
      none.hidden = true;
      return;
    }

    Passages.find(typed).then(function (found) {
      if (row.asked !== typed) return;        // the field has changed since
      block.hidden = !found;
      none.hidden = !!found;
      if (!found) return;
      block.querySelector('summary').textContent = found.title + ' · King James Version';
      Passages.show(found, block.querySelector('.passage-text'));
    }).catch(function () {
      if (row.asked !== typed) return;
      block.hidden = true;
      none.hidden = true;
    });
  }

  // Wait for a pause in typing, so half a reference does not print a chapter.
  function printSoon(row, typed) {
    if (row.printTimer) clearTimeout(row.printTimer);
    row.printTimer = setTimeout(function () { print(row, typed); }, PRINT_MS);
  }

  // ---- notes --------------------------------------------------------------
  // Notes are HTML from editor.js, which checks every note on read and write.
  // Notes written before the editor are plain text: each line becomes a
  // paragraph. The stored note changes the next time it is edited.
  function asHtml(note) {
    if (!note || /<\/?(p|br|b|strong|i|em|mark|ul|ol|li|blockquote|div|a|span)\b[^>]*>/i.test(note)) return note;
    return note.split(/\n/).filter(function (line) { return line.trim(); }).map(function (line) {
      var p = document.createElement('p');
      p.textContent = line;
      return p.outerHTML;
    }).join('');
  }

  function noteText(note) {
    return NotesEditor.clean(note).textContent.trim();
  }

  // ---- the page ----------------------------------------------------------
  var unmounts = [];

  function build(item) {
    var row = $('tpl-passage').content.firstElementChild.cloneNode(true);
    var passage = row.querySelector('.f-passage');
    row.dataset.id = item.id;

    passage.value = item.passage;

    passage.addEventListener('input', function () {
      item.passage = this.value;
      touch(item);
      printSoon(row, item.passage);
      // In Bible order a changed reference may belong elsewhere in the list.
      // It moves once no field has focus, not under the typist's hands.
      if (order === 'bible') stale = true;
    });

    var editor = NotesEditor.build('Note');
    editor.classList.add('f-note');
    row.querySelector('.editor-here').replaceWith(editor);
    unmounts.push(NotesEditor.mount(editor, {
      get: function () { return item.note; },
      set: function (html) { item.note = html; touch(item); }
    }));

    row.querySelector('.f-del').addEventListener('click', function () {
      var label = item.passage.trim();
      if ((label || noteText(item.note)) &&
          !window.confirm(label ? 'Remove ' + label + '?' : 'Remove this passage?')) return;
      // Replace with a tombstone so the removal reaches other devices.
      data.passages[data.passages.indexOf(item)] = { id: item.id, deleted: true, updatedAt: now() };
      saved();
      render();
    });

    print(row, item.passage);
    return row;
  }

  function render() {
    stale = false;
    unmounts.forEach(function (off) { off(); });
    unmounts = [];
    var items = live();
    var list = $('list');
    list.textContent = '';
    items.forEach(function (item) { list.appendChild(build(item)); });
    $('empty').hidden = items.length > 0;
    showOrder(items.length);
  }

  // ---- actions -----------------------------------------------------------
  $('add').addEventListener('click', function () {
    var stamp = now();
    var item = { id: uid(), passage: '', note: '', createdAt: stamp, updatedAt: stamp };
    data.passages.push(item);
    saved();
    render();
    var field = document.querySelector('.fav[data-id="' + item.id + '"] .f-passage');
    if (field) field.focus();
  });

  $('export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var href = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = href;
    a.download = 'passages.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(href); }, 1000);
  });

  $('import').addEventListener('click', function () { $('import-file').click(); });

  $('import-file').addEventListener('change', function () {
    var file = this.files && this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try {
        incoming = JSON.parse(reader.result);
      } catch (e) {
        window.alert('That file is not valid JSON.');
        return;
      }
      if (!incoming || !Array.isArray(incoming.passages)) {
        window.alert('That file has no passages in it.');
        return;
      }
      // An import is an explicit choice, so it wins over what is already here.
      var stamp = now();
      incoming.passages.forEach(function (p) { if (p) p.updatedAt = stamp; });
      data.passages = merge(data.passages, incoming.passages);
      saved();
      render();
    };
    reader.readAsText(file);
    this.value = '';
  });

  // ---- start -------------------------------------------------------------
  load();
  render();

  setInterval(function () { if (stale && !typing()) render(); }, 5000);
  window.addEventListener('focus', function () { if (stale && !typing()) render(); });
  // Leaving the page: do not wait out the save delay.
  window.addEventListener('pagehide', function () { if (saveTimer) saved(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && saveTimer) saved();
  });

  Notes.unlocked().then(connect);
}());
</script>

</body>
</html>
