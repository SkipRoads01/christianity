name: Cloudflare KV bootstrap

# Run once, by hand, to create the KV namespace that holds reading notes.
# The namespace id it prints goes into wrangler.toml. Safe to re-run: it
# lists first and only creates when the namespace is missing.

on:
  workflow_dispatch:

jobs:
  kv:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 26822b853a433adaf9a917ea55731830
    steps:
      - name: Create or find the NOTES namespace
        run: |
          mkdir -p /tmp/kv && cd /tmp/kv
          cat > wrangler.toml <<'TOML'
          name = "christianity"
          compatibility_date = "2026-08-01"
          TOML

          echo "=== existing namespaces ==="
          npx --yes wrangler@4 kv namespace list || true

          echo "=== create (ignored if it already exists) ==="
          npx --yes wrangler@4 kv namespace create NOTES || true

          echo "=== namespaces after ==="
          npx --yes wrangler@4 kv namespace list
