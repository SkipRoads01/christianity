<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bulletins &middot; Christianity: History, Theology, and Civilization</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/icon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="apple-mobile-web-app-title" content="Christianity" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <h1><a href="timeline.html">Christianity: History, Theology, and Civilization</a></h1>
    <nav>
      <a href="timeline.html">Timeline</a>
      <a href="denominations.html">Denominations</a>
      <a href="terminology.html">Metaontology</a>
      <a href="reading.html">Research</a>
      <a href="passages.html">Passages</a>
      <a href="ptsem.html">PTSEM</a>
      <a href="bulletins.html" id="nav-bulletins" aria-current="page" hidden>Bulletins</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- Both blocks start hidden. The script shows one of them once it knows
       whether this device has been unlocked, so neither flashes first. -->
  <div id="lock" hidden>
    <form class="lock" id="lock-form">
      <label class="field">
        <span>Passcode</span>
        <input type="password" id="passcode" autocomplete="current-password"
               autocapitalize="off" autocorrect="off" spellcheck="false" />
      </label>
      <button type="submit" class="btn btn-primary" id="unlock">Unlock</button>
      <p class="lock-state" id="lock-state" role="status"></p>
    </form>
  </div>

  <section id="app" hidden>
    <div class="bar">
      <h2>Bulletins</h2>
      <div class="bar-actions">
        <span class="sync-state" id="sync-state" role="status"></span>
        <button type="button" class="btn" id="export">Export</button>
        <button type="button" class="btn" id="import">Import</button>
        <input type="file" id="import-file" accept="application/json" hidden />
        <button type="button" class="btn" id="lock-again">Lock</button>
      </div>
    </div>

    <p class="sort" id="sort" role="group" aria-label="Sort">
      <span class="sort-label">Sort</span>
      <button type="button" class="sort-btn" data-sort="oldest" aria-pressed="false">Oldest to newest</button>
      <button type="button" class="sort-btn" data-sort="newest" aria-pressed="true">Newest to oldest</button>
    </p>

    <!-- Every Sunday on record. Each opens and closes on its own. -->
    <ul class="week-list" id="weeks"></ul>
  </section>

</main>

<template id="tpl-week">
  <article class="week">
    <div class="field">
      <span>Lessons</span>
      <ol class="readings"></ol>
      <p><button type="button" class="linkish w-add">Add lesson</button></p>
    </div>

    <div class="field">
      <span>Notes</span>
      <div class="editor-here"></div>
    </div>

    <p class="save-row">
      <button type="button" class="btn btn-primary w-save">Save</button>
      <span class="save-state" role="status"></span>
    </p>

    <p class="danger-row w-delete-row" hidden>
      <button type="button" class="linkish danger w-delete">Delete this week</button>
    </p>
  </article>
</template>

<template id="tpl-week-item">
  <li class="week-item">
    <button type="button" class="week-toggle" aria-expanded="false">
      <span class="week-toggle-text">
        <span class="eyebrow w-label" hidden></span>
        <span class="week-title w-date"></span>
        <span class="week-meta w-meta"></span>
      </span>
      <span class="week-chevron" aria-hidden="true"></span>
    </button>
    <div class="week-body" hidden></div>
  </li>
</template>

<template id="tpl-reading">
  <li class="reading">
    <div class="reading-row">
      <input type="text" class="r-label" placeholder="Lesson" aria-label="Lesson" autocomplete="off" />
      <input type="text" class="r-passage" placeholder="Passage" aria-label="Passage" autocomplete="off" />
      <button type="button" class="icon-btn r-del" title="Remove lesson" aria-label="Remove lesson">&times;</button>
    </div>
    <details class="passage" open hidden>
      <summary></summary>
      <div class="passage-text"></div>
    </details>
    <p class="passage-none" hidden>No King James passage matches this.</p>
  </li>
</template>

<script src="sync.js"></script>
<script src="passages.js"></script>
<script src="editor.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var now = function () { return Date.now(); };

  // ---- lock --------------------------------------------------------------
  // A gate in front of the form. sync.js checks the passcode and keeps the
  // key on a device that has been unlocked, so it is not asked again.
  var device = null;         // what an unlocked device holds: its key and the store's address

  function showLock(message) {
    if (link) { link.stop(); link = null; }
    device = null;
    $('app').hidden = true;
    $('nav-bulletins').hidden = true;
    $('lock').hidden = false;
    $('lock-state').textContent = message || '';
    $('passcode').value = '';
    $('passcode').focus();
  }

  function showApp(found) {
    device = found;
    $('lock').hidden = true;
    $('nav-bulletins').hidden = false;
    $('app').hidden = false;
    start();
  }

  $('lock-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var value = $('passcode').value;
    if (!value.trim()) return;
    $('unlock').disabled = true;
    $('lock-state').textContent = 'Checking';
    Notes.unlock(value).then(function (found) {
      $('unlock').disabled = false;
      if (found) { showApp(found); return; }
      $('lock-state').textContent = 'That passcode is not right.';
      $('passcode').select();
    }).catch(function () {
      $('unlock').disabled = false;
      $('lock-state').textContent = 'This browser cannot check the passcode.';
    });
  });

  $('lock-again').addEventListener('click', function () {
    Notes.lock();
    showLock('');
  });

  // ---- state -------------------------------------------------------------
  // localStorage is the source of truth for this device and works offline.
  // The store that sync.js talks to is a reconciler on top of it.
  var KEY = 'christianity.bulletins.v1';
  var TOMBSTONE_DAYS = 90;
  var READINGS = ['First lesson', 'Psalm', 'Second lesson', 'Gospel'];
  // The names this page used before it took the bulletin's own.
  var RENAMED = { 'First reading': 'First lesson', 'Second reading': 'Second lesson' };

  function lessonName(label) {
    label = String(label || '');
    return RENAMED.hasOwnProperty(label) ? RENAMED[label] : label;
  }
  var FIRST_WEEK = '2026-11-08';   // the first bulletin on record

  var data = { version: 1, weeks: [] };
  var link = null;           // the running sync, while the page is unlocked
  var stale = false;         // newer notes arrived while a field had focus
  var shownThis = null;      // the coming Sunday when the page was last drawn
  var SORT_KEY = 'christianity.bulletins.sort';   // this device's choices, not synced
  var OPEN_KEY = 'christianity.bulletins.open';

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.weeks)) data = parsed;
      }
    } catch (e) { /* start empty */ }
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      return false;
    }
  }

  var saveTimer = null;

  function save() {
    if (link) link.changed();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saved, 250);
  }

  function saved() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    var kept = persist();
    if (link) link.changed();
    return kept;
  }

  // ---- the Save button -----------------------------------------------------
  // Every change is saved as it is typed. The button saves and sends at once,
  // and says so, with the state of the sync after it.
  var savedNote = null;      // the line beside the button last pressed

  function saveNow(note) {
    if (savedNote && savedNote !== note) savedNote.textContent = '';
    savedNote = note;
    if (!saved()) {
      savedNote = null;
      note.textContent = 'Not saved. This browser has no room left for notes.';
      return;
    }
    if (link) link.now();
    saveNote();
  }

  function saveNote() {
    if (!savedNote) return;
    var sync = $('sync-state').textContent.trim();
    if (sync && !/\.$/.test(sync)) sync += '.';
    // With no store, sync.js already says "Saved on this device only."
    savedNote.textContent = /^Saved/.test(sync) ? sync : 'Saved.' + (sync ? ' ' + sync : '');
  }

  function unsaveNote() {
    if (savedNote) savedNote.textContent = '';
    savedNote = null;
  }

  if (window.MutationObserver) {
    new MutationObserver(saveNote).observe($('sync-state'), { childList: true, characterData: true, subtree: true });
  }

  // ---- weeks -------------------------------------------------------------
  // A week is named by its Sunday, in local time, as YYYY-MM-DD. That makes
  // the id the same on every device, so the same week merges with itself.
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function iso(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function fromIso(id) {
    var p = id.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function plusDays(id, n) {
    var d = fromIso(id);
    d.setDate(d.getDate() + n);
    return iso(d);
  }

  // The Sunday the bulletin is for: today on a Sunday, otherwise the next one.
  function thisWeek() {
    var d = new Date();
    d.setDate(d.getDate() + (7 - d.getDay()) % 7);
    return iso(d);
  }

  function longDate(id) {
    return fromIso(id).toLocaleDateString('en-US',
      { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  // ---- the church year ----------------------------------------------------
  // Easter by the Gregorian computus (the anonymous algorithm in Meeus,
  // Astronomical Algorithms, chapter 8). Pentecost is the seventh Sunday after
  // it. Advent starts on the fourth Sunday before Christmas.
  function easter(year) {
    var a = year % 19, b = Math.floor(year / 100), c = year % 100;
    var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    var g = Math.floor((b - f + 1) / 3);
    var h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4;
    var l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var month = Math.floor((h + l - 7 * m + 114) / 31);
    var day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
  }

  function adventOf(year) {
    var eve = new Date(year, 11, 24);
    eve.setDate(eve.getDate() - eve.getDay() - 21);
    return eve;
  }

  var ORDINALS = ['First', 'Second', 'Third', 'Fourth', 'Fifth', 'Sixth', 'Seventh',
    'Eighth', 'Ninth', 'Tenth', 'Eleventh', 'Twelfth', 'Thirteenth', 'Fourteenth',
    'Fifteenth', 'Sixteenth', 'Seventeenth', 'Eighteenth', 'Nineteenth', 'Twentieth'];

  function ordinal(n) {
    if (n <= 20) return ORDINALS[n - 1];
    var unit = ORDINALS[n - 21].toLowerCase();
    return 'Twenty-' + unit;
  }

  // The Sunday's place after Pentecost, or '' outside that season.
  function afterPentecost(id) {
    var sunday = fromIso(id);
    var pentecost = easter(sunday.getFullYear());
    pentecost.setDate(pentecost.getDate() + 49);
    if (sunday >= adventOf(sunday.getFullYear())) return '';
    var n = Math.round((sunday - pentecost) / (7 * 86400000));
    return n >= 1 ? ordinal(n) + ' Sunday after Pentecost' : '';
  }

  function find(id) {
    for (var i = 0; i < data.weeks.length; i++) {
      if (data.weeks[i].id === id) return data.weeks[i];
    }
    return null;
  }

  // A new week takes its reading names from the week before it on record, so
  // a name changed once stays changed.
  function readingNames(id) {
    var before = null, latest = null;
    data.weeks.forEach(function (w) {
      if (w.deleted || !Array.isArray(w.readings) || !w.readings.length) return;
      if (!latest || w.id > latest.id) latest = w;
      if (w.id < id && (!before || w.id > before.id)) before = w;
    });
    var from = before || latest;
    if (!from) return READINGS;
    return from.readings.map(function (r) { return lessonName(r && r.label); });
  }

  // The week on record, or a blank one that is not stored until it is edited.
  function entry(id) {
    var week = find(id);
    if (!week || week.deleted) {
      return {
        id: id, notes: '', updatedAt: 0,
        readings: readingNames(id).map(function (label) { return { label: label, passage: '' }; })
      };
    }
    // Synced and imported data is not trusted to have the right shape.
    week.notes = typeof week.notes === 'string' ? week.notes : '';
    week.readings = (Array.isArray(week.readings) ? week.readings : []).map(function (r) {
      return { label: lessonName(r && r.label), passage: String((r && r.passage) || '') };
    });
    // Weeks once had a topic field. Anything written in it moves to the top
    // of that week's notes, so the words are kept now the field is gone.
    if (typeof week.topic === 'string' && week.topic.trim()) {
      var line = document.createElement('p');
      line.textContent = week.topic.trim();
      week.notes = line.outerHTML + week.notes;
      delete week.topic;
      touch(week);
    } else if ('topic' in week) {
      delete week.topic;
    }
    return week;
  }

  function touch(week) {
    var index = data.weeks.indexOf(week);
    if (index === -1) {
      var old = find(week.id);            // a tombstone, if the week was deleted
      if (old) data.weeks[data.weeks.indexOf(old)] = week; else data.weeks.push(week);
    }
    week.updatedAt = now();
    unsaveNote();
    if (week.redraw) week.redraw();
    save();
  }

  function textOf(html) {
    return clean(html).textContent.replace(/\s+/g, ' ').trim();
  }

  function isEmpty(week) {
    if (week.notes && textOf(week.notes)) return false;
    return !(week.readings || []).some(function (r) { return r && r.passage && String(r.passage).trim(); });
  }

  // ---- merge -------------------------------------------------------------
  // Last write wins per week. A deleted week leaves a tombstone, otherwise
  // the other device would bring it back on the next pull.
  function merge(mine, theirs) {
    var out = {};
    var cutoff = now() - TOMBSTONE_DAYS * 86400000;

    function take(week) {
      if (!week || !/^\d{4}-\d{2}-\d{2}$/.test(week.id || '')) return;
      if (week.deleted && (week.updatedAt || 0) < cutoff) return;  // aged out
      var seen = out[week.id];
      if (!seen || (week.updatedAt || 0) > (seen.updatedAt || 0)) out[week.id] = week;
    }

    mine.forEach(take);
    theirs.forEach(take);

    return Object.keys(out).sort().reverse().map(function (k) { return out[k]; });
  }

  // ---- sync --------------------------------------------------------------
  function typing() {
    var el = document.activeElement;
    return !!el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.isContentEditable);
  }

  // Notes from another device. Never repaint a field the user is in the
  // middle of: the merged notes are already saved, and the page catches up
  // as soon as no field has focus.
  function arrived(weeks, changed) {
    data.weeks = weeks;
    persist();
    if (!changed) return;
    if (typing()) stale = true; else render();
  }

  function connect() {
    if (link) link.stop();
    link = Notes.sync({
      device: device,
      path: '/api/bulletins',
      field: 'weeks',
      read: function () { return data.weeks; },
      write: arrived,
      merge: merge,
      note: $('sync-state')
    });
  }

  // ---- notes markup ------------------------------------------------------
  // editor.js owns the notes editor and the check every note goes through.
  var clean = NotesEditor.clean;

  // ---- the text of a reading ----------------------------------------------
  // The passage is printed under its row from the King James files that ship
  // with the site. It is looked up from the reference each time, not stored
  // with the notes.
  var PRINT_MS = 600;

  function print(row, reading) {
    var block = row.querySelector('.passage');
    var none = row.querySelector('.passage-none');
    var typed = reading.passage;
    // In a Psalm row a reference with no book, such as 78:1-7, is a psalm.
    if (typed.trim() && /^\s*psalm/i.test(reading.label) && !Passages.parse(typed)) {
      typed = 'Psalm ' + typed;
    }
    row.asked = typed;

    if (!typed.trim()) {
      block.hidden = true;
      none.hidden = true;
      return;
    }

    Passages.find(typed).then(function (found) {
      if (row.asked !== typed) return;        // the field has changed since
      block.hidden = !found;
      none.hidden = !!found;
      if (!found) return;
      block.querySelector('summary').textContent = found.title + ' \u00b7 King James Version';
      Passages.show(found, block.querySelector('.passage-text'));
    }).catch(function () {
      if (row.asked !== typed) return;
      block.hidden = true;
      none.hidden = true;
    });
  }

  // Wait for a pause in typing, so half a reference does not print a chapter.
  function printSoon(row, reading) {
    if (row.printTimer) clearTimeout(row.printTimer);
    row.printTimer = setTimeout(function () { print(row, reading); }, PRINT_MS);
  }

  // ---- one week ----------------------------------------------------------
  var unmounts = {};         // week id -> what to undo when its notes close

  function summary(week) {
    var bits = [];
    if (afterPentecost(week.id)) bits.push(afterPentecost(week.id));
    var passages = week.readings.map(function (r) { return r.passage.trim(); })
      .filter(function (p) { return p; });
    if (passages.length) bits.push(passages.join('; '));
    else if (!isEmpty(week)) bits.push('Notes');
    return bits.join(' · ');
  }

  function buildWeek(week) {
    var id = week.id;
    var node = $('tpl-week').content.firstElementChild.cloneNode(true);
    var list = node.querySelector('.readings');

    function drawReadings() {
      list.textContent = '';
      week.readings.forEach(function (reading, index) {
        var row = $('tpl-reading').content.firstElementChild.cloneNode(true);
        var name = row.querySelector('.r-label');
        var passage = row.querySelector('.r-passage');
        name.value = reading.label;
        passage.value = reading.passage;
        name.addEventListener('input', function () { reading.label = this.value; touch(week); printSoon(row, reading); });
        passage.addEventListener('input', function () {
          reading.passage = this.value;
          touch(week);
          printSoon(row, reading);
        });
        print(row, reading);
        row.querySelector('.r-del').addEventListener('click', function () {
          if (reading.passage.trim() && !window.confirm('Remove this lesson?')) return;
          week.readings.splice(index, 1);
          touch(week);
          drawReadings();
        });
        list.appendChild(row);
      });
    }

    drawReadings();

    node.querySelector('.w-add').addEventListener('click', function () {
      week.readings.push({ label: '', passage: '' });
      touch(week);
      drawReadings();
      list.lastElementChild.querySelector('.r-label').focus();
    });

    node.querySelector('.w-save').addEventListener('click', function () {
      saveNow(node.querySelector('.save-state'));
    });

    node.querySelector('.w-delete-row').hidden = !find(id) || !!find(id).deleted;
    node.querySelector('.w-delete').addEventListener('click', function () {
      if (!window.confirm('Delete ' + longDate(id) + ' and its notes?')) return;
      var old = find(id);
      // Replace with a tombstone so the deletion reaches other devices.
      if (old) data.weeks[data.weeks.indexOf(old)] = { id: id, deleted: true, updatedAt: now() };
      saved();
      render();
    });

    var editor = NotesEditor.build('Notes');
    node.querySelector('.editor-here').replaceWith(editor);
    unmounts[id] = NotesEditor.mount(editor, {
      get: function () { return week.notes; },
      set: function (html) { week.notes = html; touch(week); }
    });
    return node;
  }

  // ---- which weeks are open ------------------------------------------------
  // Remembered on this device. When a new Sunday comes round, the page opens
  // on it again with the rest closed.
  var sort = 'newest';
  var opened = {};

  function loadChoices() {
    opened = {};
    try {
      var chosen = localStorage.getItem(SORT_KEY);
      if (chosen === 'newest' || chosen === 'oldest') sort = chosen;
      var kept = JSON.parse(localStorage.getItem(OPEN_KEY) || 'null');
      if (kept && kept.sunday === thisWeek() && Array.isArray(kept.open)) {
        kept.open.forEach(function (id) { opened[id] = true; });
        return;
      }
    } catch (e) { /* defaults */ }
    opened[thisWeek()] = true;
  }

  function keepChoices() {
    try {
      localStorage.setItem(SORT_KEY, sort);
      localStorage.setItem(OPEN_KEY, JSON.stringify({ sunday: thisWeek(), open: Object.keys(opened) }));
    } catch (e) { /* this visit only */ }
  }

  function close(id) {
    if (unmounts[id]) { unmounts[id](); delete unmounts[id]; }
  }

  // ---- the page ----------------------------------------------------------
  function render() {
    stale = false;
    savedNote = null;
    Object.keys(unmounts).forEach(close);

    var current = thisWeek();
    var next = plusDays(current, 7);
    if (shownThis && shownThis !== current) loadChoices();
    shownThis = current;

    // Every Sunday from the first bulletin to next week is listed, written up
    // or not, so a week that was missed can be opened and filled in.
    var ids = {};
    for (var id = FIRST_WEEK; id <= next; id = plusDays(id, 7)) ids[id] = true;
    data.weeks.forEach(function (w) {
      if (w && !w.deleted && !ids[w.id] && !isEmpty(entry(w.id))) ids[w.id] = true;
    });
    var order = Object.keys(ids).sort();
    if (sort === 'newest') order.reverse();

    var list = $('weeks');
    list.textContent = '';

    order.forEach(function (id) {
      var week = entry(id);
      var item = $('tpl-week-item').content.firstElementChild.cloneNode(true);
      var toggle = item.querySelector('.week-toggle');
      var body = item.querySelector('.week-body');
      var meta = item.querySelector('.w-meta');
      var label = id === current ? 'This Sunday' : id === next ? 'Next Sunday' : '';
      item.dataset.week = id;
      item.querySelector('.w-label').textContent = label;
      item.querySelector('.w-label').hidden = !label;
      item.querySelector('.w-date').textContent = longDate(id);

      // Kept off the stored week: JSON leaves functions out.
      week.redraw = function () {
        meta.textContent = summary(week) || 'No notes';
        var row = body.querySelector('.w-delete-row');
        if (row) row.hidden = false;
      };
      meta.textContent = summary(week) || 'No notes';

      function show(on) {
        toggle.setAttribute('aria-expanded', String(on));
        body.hidden = !on;
        if (on && !body.firstChild) body.appendChild(buildWeek(week));
        if (!on) { close(id); body.textContent = ''; }
      }

      toggle.addEventListener('click', function () {
        var on = toggle.getAttribute('aria-expanded') !== 'true';
        if (on) opened[id] = true; else delete opened[id];
        keepChoices();
        show(on);
      });

      show(!!opened[id]);
      list.appendChild(item);
    });
  }

  // ---- actions -----------------------------------------------------------
  function showSort() {
    Array.prototype.forEach.call(document.querySelectorAll('.sort-btn'), function (btn) {
      btn.setAttribute('aria-pressed', String(btn.dataset.sort === sort));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.sort-btn'), function (btn) {
    btn.addEventListener('click', function () {
      if (sort === btn.dataset.sort) return;
      sort = btn.dataset.sort;
      keepChoices();
      showSort();
      render();
    });
  });

  $('export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var href = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = href;
    a.download = 'bulletins.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(href); }, 1000);
  });

  $('import').addEventListener('click', function () { $('import-file').click(); });

  $('import-file').addEventListener('change', function () {
    var file = this.files && this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try {
        incoming = JSON.parse(reader.result);
      } catch (e) {
        window.alert('That file is not valid JSON.');
        return;
      }
      if (!incoming || !Array.isArray(incoming.weeks)) {
        window.alert('That file has no weeks in it.');
        return;
      }
      // An import is an explicit choice, so it wins over what is already here.
      var stamp = now();
      incoming.weeks.forEach(function (w) { if (w) w.updatedAt = stamp; });
      data.weeks = merge(data.weeks, incoming.weeks);
      saved();
      render();
    };
    reader.readAsText(file);
    this.value = '';
  });

  // ---- start -------------------------------------------------------------
  var started = false;

  function refresh() {
    if ($('app').hidden || typing()) return;
    // The week turns over at midnight on Sunday while the page sits open.
    if (stale || thisWeek() !== shownThis) render();
  }

  function start() {
    load();
    loadChoices();
    showSort();
    render();
    connect();
    if (started) return;
    started = true;
    setInterval(refresh, 5000);
    window.addEventListener('focus', refresh);
    // Leaving the page: do not wait out the save delay.
    window.addEventListener('pagehide', function () { if (saveTimer) saved(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden' && saveTimer) saved();
    });
  }

  Notes.unlocked().then(function (found) {
    if (found) showApp(found); else showLock('');
  });
}());
</script>

</body>
</html>
