name = "christianity"
main = "worker.js"
compatibility_date = "2026-08-01"

# Pin the account id. Without it wrangler lists accounts to work out where to
# deploy, and a token scoped to one account cannot do that lookup.
account_id = "26822b853a433adaf9a917ea55731830"

[assets]
directory = "./dist"
binding = "ASSETS"
# Keep .html URLs exactly as written; without this every link 307s to an
# extensionless path and existing bookmarks change.
html_handling = "none"

# Reading notes. Create with:  npx wrangler kv namespace create NOTES
[[kv_namespaces]]
binding = "NOTES"
id = "b60ddfd2efed456ba38ed4d3bc41ebbf"
